name = "CareerPilot — Global Salesforce Jobs"
[auth]
enabled = true
providers = ["email"]

[ai]
required = true
providers = ["anthropic"]
description = "AI-powered job relevance scoring, job-description analysis, and fact-grounded resume tailoring. CareerPilot uses the Anthropic provider for the Sonnet model; configure its credential through Hatchable AI settings."

[db.tables.candidate_profiles]
read = "own"
write = "own"

# Shared job catalogue: visible to users, writable only by trusted platform collaborators/scheduled ingestion.
[db.tables.job_leads]
read = "public"
write = "member"

[db.tables.applications]
read = "own"
write = "own"

[db.tables.job_matches]
read = "own"
write = "own"

[db.tables.submission_attempts]
read = "own"
write = "own"

[db.tables.application_reviews]
read = "own"
write = "own"

[db.tables.candidate_documents]
read = "own"
write = "own"

[db.tables.linkedin_job_intakes]
read = "own"
write = "own"

[db.tables.linkedin_scraper_preferences]
read = "own"
write = "own"

# Readable to the server, writable only by trusted project members.
[db.tables.linkedin_scraper_control]
read = "public"
write = "member"

[db.tables.user_action_limits]
read = "own"
write = "own"

[db.tables.automation_runs]
read = "own"
write = "own"

[[secret]]
name = "ADZUNA_APP_ID"
required = true
description = "Adzuna API application ID for global job discovery. Add in Hatchable project Setup; never place the value in source code."

[[secret]]
name = "ADZUNA_APP_KEY"
required = true
description = "Adzuna API key for global job discovery. Add in Hatchable project Setup; never place the value in source code."

# AI provider credentials are configured in the Hatchable AI settings, not as ordinary app secrets.

[[cron]]
path = "/api/jobs/daily-discovery"
schedule = "0 2 * * *"

[[cron]]
path = "/api/jobs/score-batch"
schedule = "0 3 * * *"

[[cron]]
path = "/api/jobs/freehire-discovery"
schedule = "30 2 * * *"