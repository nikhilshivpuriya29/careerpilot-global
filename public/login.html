<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · CareerPilot</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5f4ff,#f7f8fc);margin:0}.login{width:min(400px,calc(100% - 34px));background:#fff;border:1px solid #e6e6f0;border-radius:20px;padding:32px;box-shadow:0 18px 60px #2424430c}.login h1{font:800 25px Manrope;margin:25px 0 7px;letter-spacing:-.8px}.login p{color:#85899a;font-size:12px;line-height:1.7}.login input,.login button{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;margin-top:10px;font:inherit}.login input{border:1px solid #e0e2ed}.login button{border:0;background:#181b34;color:#fff;font-weight:700;cursor:pointer}.login .secondary{background:white;color:#6254d3;border:1px solid #e0e2ed}.msg{min-height:20px;color:#b24d4d;font-size:11px}.logo{display:flex;align-items:center;gap:10px;font:800 17px Manrope}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#6657e8;color:#fff}.tiny{font-size:10px;color:#999;letter-spacing:.6px;margin-top:24px}</style></head><body><main class="login"><div class="logo"><span class="mark">CP</span>CareerPilot</div><h1>Welcome back.</h1><p>Sign in to sync your candidate profile, job pipeline and tailored resume drafts across sessions. We'll email a one-time code; no password needed.</p><form id="f"><input id="email" type="email" required autocomplete="username webauthn" placeholder="Email address"><input id="code" hidden autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button id="go">Send sign-in code</button><button id="back" type="button" class="secondary" hidden>Use another email</button></form><div class="msg" id="msg" role="status"></div><div class="tiny">Your job profile is private to your account.</div></main><script>(function(){const A=window.hatchable.auth,f=document.getElementById('f'),e=document.getElementById('email'),c=document.getElementById('code'),g=document.getElementById('go'),b=document.getElementById('back'),m=document.getElementById('msg');let step=0,passkey=false;const next=(()=>{let n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')&&!n.includes('\\')?n:'/'} )();function done(){location.replace(next)}A.getSession().then(s=>{if(s&&s.user)done()}).catch(()=>{});f.addEventListener('submit',async ev=>{ev.preventDefault();g.disabled=true;m.textContent='';try{if(!step){const r=await A.startLogin({email:e.value.trim()});passkey=!!r.has_passkey;if(passkey&&A.supportsPasskeys()){try{const d=await A.signInWithPasskey({email:e.value.trim()});if(d&&d.user){done();return}}catch(x){}}step=1;e.disabled=true;c.hidden=false;b.hidden=false;g.textContent='Verify code';m.textContent='Check your email for the sign-in code.';c.focus()}else{const d=await A.verifyCode({email:e.value.trim(),code:c.value.trim()});if(d&&d.user){if(!passkey&&A.supportsPasskeys()&&localStorage.getItem('cp_passkey_offer')!=='1'){const ok=confirm('Add a passkey for quicker sign-in next time? You can use fingerprint, face or device screen lock.');if(ok){try{await A.registerPasskey()}catch(x){}}else localStorage.setItem('cp_passkey_offer','1')}done()}}}catch(x){m.textContent=x.message||'Sign-in failed. Please try again.'}finally{g.disabled=false}});b.addEventListener('click',()=>{step=0;e.disabled=false;c.hidden=true;b.hidden=true;g.textContent='Send sign-in code';m.textContent='';e.focus()})})();</script></body></html>
