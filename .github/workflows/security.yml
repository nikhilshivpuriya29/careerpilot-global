name: Security checks

on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan tracked files for accidental secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency inventory and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit npm dependencies if a package manifest exists
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm audit --audit-level=high
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm audit --audit-level high
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn audit --level high
          else
            echo "No Node lockfile found; dependency audit is not applicable to this repository snapshot."
          fi
